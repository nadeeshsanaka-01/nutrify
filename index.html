<!DOCTYPE html>
<html>

<head>
  <title>Index</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
</head>

<body style="background-color: #2979ff">
  <div class="card" style="width: 600px;height:600px;margin-left: 400px;margin-top: 100px;">
    <div class="card-body">
      <h3 class="card-title">Enter any fruit Name</h3>
      <form action="http://localhost:5000/enterit" method="post">
        <div class="form-group">
          <label for="nm">Enter fruit name!</label>
          <input type="text" class="form-control" id="nm" name="nm">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <div>
          {% if data == "Not Found" %}
          <p>
          <div style="color: red;">Please give a valid fruit name!</div>
          </p>
          {% else %}
          {% if data == "" %}
          <p></p>
          {% else %}
          {% if data == "Enter any fruit name!" %}
          <p>
          <div style="color: red;">{{data}}</div>
          </p>
          {% else %}
          <img src={{data}} width="500" height="400" alt="Your Nutrients Piechart will be displayed here" />
          {% endif %}
          {% endif %}
          {% endif %}
        </div>
      </form>
    </div>
  </div>

</body>

</html>
